services:
  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - recruitpro

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    networks:
      - recruitpro

  ats:
    build: ./Backend/applicant_tracking_system
    ports:
      - "5001:5001"
    env_file:
      - ./Backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ats:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - recruitpro

networks:
  recruitpro:
    driver: bridge